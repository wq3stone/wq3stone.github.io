<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实用工具导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .tool-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .tool-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .tool-desc {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .tool-url {
            font-size: 12px;
            color: #3498db;
            word-break: break-all;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px 0;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>实用工具导航</h1>
            <p class="subtitle">精选在线工具，提升工作效率</p>
        </header>
        
        <div class="tools-grid">
            <a href="./picompress/index.html" class="tool-card" target="_blank">
                <h3 class="tool-title">图片压缩工具</h3>
                <p class="tool-desc">快速压缩图片大小，保持良好画质</p>
            </a>
            
            <a href="./randomVideo.html" class="tool-card" target="_blank">
                <h3 class="tool-title">随机视频</h3>
                <p class="tool-desc">获取随机抖音视频内容，用于测试或娱乐</p>
            </a>
            
            <a href="./randomBeauty.html" class="tool-card" target="_blank">
                <h3 class="tool-title">随机视频2</h3>
                <p class="tool-desc">随机获取抖音视频内容，用于测试或娱乐</p>
            </a>
            
            <a href="./wordCount/index.html" class="tool-card" target="_blank">
                <h3 class="tool-title">字符统计</h3>
                <p class="tool-desc">快速统计文本中不同类型的字数、字符数等信息</p>
            </a>
            
            <a href="./qrcode/index.html" class="tool-card" target="_blank">
                <h3 class="tool-title">二维码工具</h3>
                <p class="tool-desc">生成或识别各种内容的二维码图片</p>
            </a>
            
            <a href="./png2ico/index.html" class="tool-card" target="_blank">
                <h3 class="tool-title">PNG转ICO</h3>
                <p class="tool-desc">将PNG图片转换为ICO图标格式</p>
            </a>
            
            <a href="./md/index.html" class="tool-card" target="_blank">
                <h3 class="tool-title">Markdown编辑器</h3>
                <p class="tool-desc">在线编辑和预览Markdown文档</p>
            </a>
        </div>
        
        <footer>
            <p>© 2025 实用工具导航 | 所有工具由 tool.wq3stone.cn 提供</p>
        </footer>
    </div>
</body>
</html>
